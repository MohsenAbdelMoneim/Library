<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0d">
  <!-- ✅ السبلاش صفحة عبور — ماينفعش يتفرس بدل المحتوى الحقيقي -->
  <meta name="robots" content="noindex, follow">
  <title>Nexora Academy</title>

  <!-- ✅ Fallback شامل: لو JS مش هيشتغل لأي سبب، التحويل يحصل برضه
       (الـJS بيوصل الأول عادةً فمش هتحس بيه) -->
  <meta http-equiv="refresh" content="5;url=landing.html">

  <link rel="shortcut icon" href="Gemini_Generated_Image_tsfpgwtsfpgwtsfp.jpg" type="image/x-icon">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: 'IBM Plex Sans Arabic', sans-serif;
      background: #0a0a0d;
      color: #ececf1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      background-image:
        radial-gradient(900px 500px at 85% -5%, rgba(79,124,255,.25), transparent 55%),
        radial-gradient(700px 450px at 5% 30%,  rgba(124,92,255,.18), transparent 55%),
        radial-gradient(800px 500px at 50% 105%, rgba(240,181,62,.15), transparent 55%);
      position: relative;
    }

    .bg-lines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .3;
      background-image:
        linear-gradient(rgba(79,124,255,.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(79,124,255,.06) 1px, transparent 1px);
      background-size: 40px 40px;
      -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 75%);
      mask-image: radial-gradient(circle at center, black 30%, transparent 75%);
      animation: gridMove 20s linear infinite;
    }
    @keyframes gridMove {
      0% { background-position: 0 0; }
      100% { background-position: 40px 40px; }
    }

    .splash-wrap {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 24px;
    }

    .logo-badge {
      width: 96px;
      height: 96px;
      margin: 0 auto 24px;
      border-radius: 28px;
      display: grid;
      place-items: center;
      font-size: 48px;
      background: linear-gradient(135deg, #4f7cff, #7c5cff);
      box-shadow: 0 20px 60px rgba(79,124,255,.5);
      animation: logoIn .8s cubic-bezier(.34,1.56,.64,1) backwards;
      position: relative;
    }
    .logo-badge::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 32px;
      background: linear-gradient(135deg, #4f7cff, #7c5cff, #f0b53e);
      z-index: -1;
      opacity: .5;
      filter: blur(12px);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes logoIn {
      from { opacity: 0; transform: scale(.5) rotate(-10deg); }
      to   { opacity: 1; transform: scale(1) rotate(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: .5; transform: scale(1); }
      50%      { opacity: .8; transform: scale(1.05); }
    }

    .brand {
      font-size: clamp(28px, 6vw, 44px);
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #fff 30%, #f0b53e);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: fadeUp .6s ease .3s backwards;
    }

    .tagline {
      font-size: clamp(12px, 2.5vw, 14px);
      color: #9c9cab;
      letter-spacing: 4px;
      margin-bottom: 40px;
      font-weight: 600;
      animation: fadeUp .6s ease .5s backwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .progress-wrap {
      width: min(280px, 80vw);
      height: 4px;
      background: rgba(255,255,255,.06);
      border-radius: 999px;
      margin: 0 auto 16px;
      overflow: hidden;
      animation: fadeUp .6s ease .7s backwards;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4f7cff, #7c5cff, #f0b53e);
      border-radius: 999px;
      transition: width .3s ease;
      box-shadow: 0 0 12px rgba(79,124,255,.5);
    }

    .loading-text {
      font-size: 12.5px;
      color: #66666f;
      font-weight: 500;
      animation: fadeUp .6s ease .9s backwards;
    }
    .loading-text .dots::after {
      content: '';
      animation: dots 1.5s steps(4, end) infinite;
    }
    @keyframes dots {
      0%   { content: ''; }
      25%  { content: '.'; }
      50%  { content: '..'; }
      75%  { content: '...'; }
      100% { content: ''; }
    }

    /* ✅ زرار التخطي — ظاهر بس خفيف */
    .skip-splash {
      position: fixed;
      top: 16px;
      inset-inline-end: 16px;
      z-index: 10;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      color: #9c9cab;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: .15s;
      animation: fadeUp .6s ease 1.1s backwards;
    }
    .skip-splash:hover {
      color: #ececf1;
      border-color: rgba(240,181,62,.5);
    }
    .skip-splash:focus-visible {
      outline: 2px solid #f0b53e;
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- ✅ ولو بدون JS: لينك مباشر (مع الـmeta refresh في الهيد كشبكة أمان) -->
  <noscript>
    <div style="position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#0a0a0d;color:#ececf1;font-family:sans-serif;text-align:center;padding:24px">
      <div>
        <p style="margin-bottom:16px">لو مش هتتحوّل تلقائيًا:</p>
        <a href="landing.html" style="color:#f0b53e;font-weight:700">ادخل هنا ←</a>
      </div>
    </div>
  </noscript>

  <div class="bg-lines" aria-hidden="true"></div>

  <!-- ✅ تخطي الشاشة -->
  <button type="button" class="skip-splash" id="skipBtn">تخطي ←</button>

  <div class="splash-wrap">
    <div class="logo-badge" aria-hidden="true">🎓</div>
    <h1 class="brand">Nexora Academy</h1>
    <p class="tagline">LEARN · BUILD · GROW</p>

    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar"
           role="progressbar" aria-label="جاري تحميل المنصة"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
    </div>
    <p class="loading-text" aria-live="polite">جاري التحميل<span class="dots"></span></p>
  </div>

  <script>
    (function () {
      'use strict';

      var bar = document.getElementById('progressBar');
      var started = false;   /* ✅ يمنع الـstep المزدوج (كان race condition حقيقي) */
      var done = false;      /* ✅ يمنع التحويل المزدوج */

      function go() {
        if (done) return;
        done = true;
        try { window.location.replace('landing.html'); }
        catch (e) { window.location.href = 'landing.html'; }
      }

      /* ✅ تخطي: من الزرار أو أي ضغطة على الصفحة */
      document.getElementById('skipBtn').addEventListener('click', go);
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') go();
      });

      function setProgress(p) {
        bar.style.width = p + '%';
        bar.setAttribute('aria-valuenow', String(Math.round(p)));
      }

      function step() {
        if (started) return;   /* 🔑 الإصلاح: مرة واحدة بس */
        started = true;

        var progress = 0;
        (function tick() {
          progress += Math.random() * 18 + 10;
          if (progress > 100) progress = 100;
          setProgress(progress);

          if (progress < 100) {
            setTimeout(tick, 140 + Math.random() * 120);
          } else {
            setTimeout(go, 350);
          }
        })();
      }

      /* ✅ الزيارة التانية في نفس الجلسة = سبلاش أسرع بكثير
         (قبل كده كل زيارة بتدفع ~2.2 ثانية كاملة) */
      var seen = false;
      try {
        seen = sessionStorage.getItem('nexora_splash') === '1';
        sessionStorage.setItem('nexora_splash', '1');
      } catch (e) { /* التخزين مقفول — نتعامل كأول زيارة */ }
      var startDelay = seen ? 0 : 200;

      if (document.readyState === 'complete') {
        setTimeout(step, startDelay);
      } else {
        window.addEventListener('load', function () { setTimeout(step, startDelay); });
        /* fallback لو load اتأخر */
        setTimeout(step, startDelay + 1300);
      }

      /* ✅ أقصى مهلة قصوى — مهما حصل، التحويل بيحصل (شبكة أمان فوق الشبكة) */
      setTimeout(go, 4500);
    })();
  </script>
</body>
</html>
